<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치와 둥근 모서리까지 화면을 쓰고, 여백은 CSS의 safe-area로 맞춥니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 기기가 어두운 모드여도 항상 밝은 화면으로 보여줍니다. 브라우저가 색을 강제로 어둡게 바꾸지 않게 합니다. -->
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#f5f6fa" />
    <!-- 아이콘: 사용자가 준비한 그림에서 가운데 둥근 네모를 잘라 만들었습니다. (design/icon-source.png, scripts/crop-icon.py) -->
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <title>학습체크</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
